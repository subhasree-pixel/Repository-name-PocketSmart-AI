{% extends "base.html" %}

{% block content %}

<section class="auth">

    <div class="panel">

        <p class="eyebrow">
            WELCOME BACK
        </p>

        <h1>
            Sign in
        </h1>

        <p>
            Access your saved plans and
            recommendation history.
        </p>


        <form id="loginForm">

            <label>
                Email

                <input
                    name="username"
                    type="email"
                    required
                >
            </label>


            <label>
                Password

                <input
                    name="password"
                    type="password"
                    required
                >
            </label>


            <button
                class="btn"
                type="submit"
            >
                Sign in
            </button>


            <div
                id="formMessage"
                class="message"
            ></div>

        </form>


        <p class="muted">

            New here?

            <a href="/register">
                Create an account
            </a>

        </p>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script>
    bindLogin();
</script>

{% endblock %}
